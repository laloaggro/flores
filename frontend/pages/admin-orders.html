    <meta property="og:type" content="website">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://arreglos-victoria-backend.onrender.com/admin-orders.html">

    <meta property="twitter:description" content="Panel de administración de pedidos en Arreglos Victoria Florería.">

</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main id="main-content">
        <div class="container">
            <div class="admin-header">
                <h2>Gestión de Pedidos</h2>
                <p>Administra y actualiza el estado de los pedidos</p>
            </div>
            
            <div class="admin-controls">
                <div class="search-container">
                    <input type="text" id="orderSearch" placeholder="Buscar pedidos..." class="form-control">
                </div>
                <div class="filter-sort">
                    <select id="orderStatusFilter" class="form-control">
                        <option value="">Todos los estados</option>
                        <option value="pending">Pendiente</option>
                        <option value="processing">Procesando</option>
                        <option value="shipped">Enviado</option>
                        <option value="delivered">Entregado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                    <select id="orderSort" class="form-control">
                        <option value="newest">Más recientes</option>
                        <option value="oldest">Más antiguos</option>
                        <option value="highest">Mayor valor</option>
                        <option value="lowest">Menor valor</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="refreshOrdersBtn">
                    <i class="fas fa-sync"></i> Refrescar
                </button>
            </div>
            
            <div class="table-responsive">
                <table class="admin-orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Los pedidos se cargarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
            
            <div id="ordersPagination" class="pagination-container">
                <!-- La paginación se generará aquí -->
            </div>
        </div>
        
        <!-- Modal para editar estado de pedido -->
        <div id="editOrderModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Editar Estado del Pedido</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="editOrderForm">
                        <input type="hidden" id="orderId">
                        <div class="form-group">
                            <label for="orderStatus">Estado:</label>
                            <select id="orderStatus" class="form-control" required>
                                <option value="pending">Pendiente</option>
                                <option value="processing">Procesando</option>
                                <option value="shipped">Enviado</option>
                                <option value="delivered">Entregado</option>
                                <option value="cancelled">Cancelado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="orderNotes">Notas:</label>
                            <textarea id="orderNotes" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelEditOrder">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Actualizar Estado</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar componentes migrados
        import Header from './assets/js/components/ui/Header.js';
        import Footer from './assets/js/components/ui/Footer.js';
        
        // Registrar componentes
        if (!customElements.get('site-header')) {
            customElements.define('site-header', Header);
        }
        
        if (!customElements.get('site-footer')) {
            customElements.define('site-footer', Footer);
        }
        
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL } from './assets/js/components/utils/utils.js';
        import { initUserMenu, isAuthenticated, setAuthState } from './assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
            
            // Verificar autenticación y rol de administrador
            const user = JSON.parse(localStorage.getItem('user'));
            if (!isAuthenticated() || !user || user.role !== 'admin') {
                window.location.href = '/login.html';
                return;
            }
            
            // Cargar pedidos
            loadOrders();
        });
        
        // Cargar pedidos
        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/orders`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Error al cargar pedidos');
                }
                
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error('Error al cargar pedidos:', error);
                showNotification('Error al cargar pedidos', 'error');
                document.getElementById('adminOrdersContainer').innerHTML = '<p>Error al cargar pedidos. Por favor intente nuevamente.</p>';
            }
        }
        
        // Renderizar pedidos
        function renderOrders(orders) {
            const ordersContainer = document.getElementById('adminOrdersContainer');
            if (!ordersContainer) return;
            
            if (!orders || orders.length === 0) {
                ordersContainer.innerHTML = '<p>No hay pedidos aún.</p>';
                return;
            }
            
            ordersContainer.innerHTML = `
                <div class="orders-table-container">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orders.map(order => `
                                <tr>
                                    <td>${order.id}</td>
                                    <td>${order.customerName}</td>
                                    <td>${new Date(order.date).toLocaleDateString()}</td>
                                    <td>$${order.total}</td>
                                    <td>
                                        <span class="order-status ${order.status}">${order.status}</span>
                                    </td>
                                    <td>
                                        <button onclick="viewOrder(${order.id})" class="btn btn-secondary">
                                            <i class="fas fa-eye"></i> Ver
                                        </button>
                                        <button onclick="updateOrderStatus(${order.id})" class="btn btn-primary">
                                            <i class="fas fa-edit"></i> Actualizar
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        // Ver detalles del pedido
        function viewOrder(orderId) {
            // Redirigir a la página de detalles del pedido
            window.location.href = `order-detail.html?id=${orderId}`;
        }
        
        // Actualizar estado del pedido
        function updateOrderStatus(orderId) {
            showNotification(`Funcionalidad para actualizar estado del pedido ${orderId} no implementada aún`, 'info');
        }
    </script>
</body>
</html>
