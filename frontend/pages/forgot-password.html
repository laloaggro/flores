<head>
    <meta charset="UTF-8">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

    <meta property="twitter:title" content="Recuperar Contraseña - Florería Arreglos Victoria">
    <meta property="twitter:description" content="Recupera tu contraseña para acceder a tu cuenta en Arreglos Victoria.">
    <meta property="twitter:image" content="/assets/images/logo.avif">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/assets/images/logo.avif" as="image">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header-component></header-component>
    
    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <h1>Recuperar Contraseña</h1>
                    <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
                    
                    <form id="forgotPasswordForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane"></i> Enviar Enlace de Recuperación
                        </button>
                    </form>
                    
                    <div class="auth-links">
                        <p>¿Recordaste tu contraseña? <a href="/login.html">Inicia sesión aquí</a></p>
                        <p>¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer -->
    <footer-component></footer-component>
    
    <!-- Scripts -->
    <script type="module">
        import { showNotification, API_BASE_URL } from './assets/js/components/utils/utils.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('forgotPasswordForm');
            const emailInput = document.getElementById('email');
            const submitBtn = document.querySelector('button[type="submit"]');
        
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = emailInput.value.trim();
                    
                    if (!email) {
                        showNotification('Por favor ingrese su correo electrónico', 'error');
                        return;
                    }
                    
                    // Validar formato de email
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        showNotification('Por favor ingrese un correo electrónico válido', 'error');
                        return;
                    }
                    
                    // Deshabilitar botón y mostrar indicador de carga
                    submitBtn.disabled = true;
                    const originalBtnText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            showNotification('Se ha enviado un enlace de recuperación a su correo electrónico', 'success');
                            form.reset();
                        } else {
                            throw new Error(data.message || 'Error al enviar solicitud de recuperación');
                        }
                    } catch (error) {
                        console.error('Error al enviar solicitud de recuperación:', error);
                        showNotification(error.message || 'Error al enviar solicitud de recuperación. Por favor intente nuevamente.', 'error');
                    } finally {
                        // Rehabilitar botón
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                });
            }
        });
    </script>
</body>
</html>
