<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main id="main-content">
        <!-- Hero Section -->
        <section class="hero half-height">
            <div class="hero-content">
                <h1>Mis Pedidos</h1>
                <p>Consulta tu historial de pedidos</p>
            </div>
        </section>

        <!-- Pedidos de usuario -->
        <section class="orders-section">
            <div class="container">
                <h1>Mis Pedidos</h1>
                <div id="ordersContainer" class="orders-container">
                    <div class="loading-placeholder">
                        <p><i class="fas fa-spinner fa-spin"></i> Cargando pedidos...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar componentes migrados
        import Header from './assets/js/components/ui/Header.js';
        import Footer from './assets/js/components/ui/Footer.js';
        
        // Registrar componentes
        if (!customElements.get('site-header')) {
            customElements.define('site-header', Header);
        }
        
        if (!customElements.get('site-footer')) {
            customElements.define('site-footer', Footer);
        }
        
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL } from './assets/js/components/utils/utils.js';
        import { initUserMenu, isAuthenticated, setAuthState } from './assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
            
            // Verificar autenticación
            if (!isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }
            
            // Cargar pedidos
            loadOrders();
        });
        
        // Cargar pedidos
        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE_URL}/orders`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Error al cargar pedidos');
                }
                
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error('Error al cargar pedidos:', error);
                // Mostrar notificación de error
                const notification = document.createElement('div');
                notification.className = 'notification error';
                notification.textContent = 'Error al cargar pedidos';
                document.body.appendChild(notification);
                
                // Eliminar notificación después de 5 segundos
                setTimeout(() => {
                    notification.remove();
                }, 5000);
                document.getElementById('ordersContainer').innerHTML = '<p>Error al cargar pedidos. Por favor intente nuevamente.</p>';
            }
        }
        
        // Renderizar pedidos
        function renderOrders(orders) {
            const ordersContainer = document.getElementById('ordersContainer');
            if (!ordersContainer) return;
            
            if (!orders || orders.length === 0) {
                ordersContainer.innerHTML = '<p>No tienes pedidos aún.</p>';
                return;
            }
            
            ordersContainer.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <h3>Pedido #${order.id}</h3>
                        <span class="order-status ${order.status}">${order.status}</span>
                    </div>
                    <div class="order-details">
                        <p><strong>Fecha:</strong> ${new Date(order.date).toLocaleDateString()}</p>
                        <p><strong>Total:</strong> $${order.total}</p>
                        <p><strong>Productos:</strong> ${order.items?.length || 0}</p>
                    </div>
                    <div class="order-actions">
                        <button onclick="viewOrderDetails(${order.id})" class="btn btn-secondary">
                            <i class="fas fa-eye"></i> Ver Detalles
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // Ver detalles del pedido
        function viewOrderDetails(orderId) {
            // Redirigir a la página de detalles del pedido
            window.location.href = `order-detail.html?id=${orderId}`;
        }
    </script>
</body>
