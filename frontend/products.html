<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Arreglos Victoria Florería</title>
    <meta name="description" content="Explora nuestro catálogo completo de arreglos florales, ramos, plantas y accesorios.">
    
    <!-- Meta etiquetas Open Graph para redes sociales -->
    <meta property="og:title" content="Productos - Arreglos Victoria Florería">
    <meta property="og:description" content="Explora nuestro catálogo completo de arreglos florales, ramos, plantas y accesorios.">
    <meta property="og:type" content="website">
    
    <!-- Preload de recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="assets/css/consistent-theme.css" as="style">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
</head>
<body data-theme="light">
    <!-- Header -->
    <site-header></site-header>
    
    <main id="main-content">
        <main id="main-content" tabindex="-1">
            <section class="hero half-height">
                <div class="hero-content">
                    <h1>Nuestros Productos</h1>
                    <p>Descubre nuestra amplia variedad de arreglos florales</p>
                </div>
            </section>
            
            <products-component id="products-component"></products-component>
        </main>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module" src="components/Header.js"></script>
    <script type="module" src="components/Footer.js"></script>
    <script type="module" src="components/ProductCard.js"></script>
    <script type="module" src="components/Products.js"></script>
    <script type="module" src="assets/js/utils.js"></script>
    <script type="module" src="assets/js/cart.js"></script>
    <script type="module" src="assets/js/userMenu.js"></script>
    <script type="module" src="assets/js/header.js"></script>
    <script type="module" src="assets/js/theme.js"></script>
    
    <!-- Asegurar que el tema se aplique correctamente -->
    <script>
        // Si theme.js no establece el tema, usamos un script de respaldo
        document.addEventListener('DOMContentLoaded', function() {
            const html = document.documentElement;
            const theme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                html.classList.add('dark');
            }
        });
    </script>
</body>
</html>
