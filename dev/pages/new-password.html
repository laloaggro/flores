<body>
    <!-- Header Component -->
    <header-component></header-component>
    
    <main class="main-content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <h1>Establecer Nueva Contraseña</h1>
                        <p>Ingresa tu nueva contraseña a continuación.</p>
                    </div>
                    
                    <form id="resetPasswordForm" class="auth-form">
                        <input type="hidden" id="token" name="token" value="">
                        
                        <div class="form-group">
                            <label for="newPassword">Nueva Contraseña</label>
                            <input type="password" id="newPassword" name="newPassword" required minlength="6">
                            <small>La contraseña debe tener al menos 6 caracteres</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">Cambiar Contraseña</button>
                        
                        <div class="auth-links">
                            <a href="login.html">Volver al inicio de sesión</a>
                        </div>
                    </form>
                    
                    <div id="messageContainer" class="message-container" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer Component -->
    <footer-component></footer-component>
    
    <!-- Scripts -->
    <script type="module">
        import { API_BASE_URL, showNotification } from '/assets/js/components/utils/utils.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            // Obtener token de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showNotification('Token de recuperación no encontrado. Por favor, solicita un nuevo enlace de recuperación.', 'error');
                return;
            }
            
            document.getElementById('token').value = token;
            
            const newPasswordForm = document.getElementById('resetPasswordForm');
            const updateButton = document.querySelector('.btn-primary');
            
            newPasswordForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const password = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validaciones
                if (!password || !confirmPassword) {
                    showNotification('Por favor complete todos los campos', 'error');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showNotification('Las contraseñas no coinciden', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showNotification('La contraseña debe tener al menos 6 caracteres', 'error');
                    return;
                }
                
                // Deshabilitar botón y mostrar indicador de carga
                updateButton.disabled = true;
                const originalBtnText = updateButton.innerHTML;
                updateButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Actualizando...';
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/users/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            token: token,
                            newPassword: password
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showNotification('Contraseña actualizada exitosamente', 'success');
                        // Redirigir a la página de login después de 3 segundos
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        throw new Error(data.error || 'Error al actualizar la contraseña');
                    }
                } catch (error) {
                    console.error('Error al actualizar la contraseña:', error);
                    showNotification(error.message || 'Error al actualizar la contraseña. Por favor intente nuevamente.', 'error');
                } finally {
                    // Rehabilitar botón
                    updateButton.disabled = false;
                    updateButton.innerHTML = originalBtnText;
                }
            });
        });
    </script>
</body>
