<body data-theme="light" class="login-page">
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main id="main-content">
        <!-- Hero Section -->
        <section class="hero half-height">
            <div class="hero-content">
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta para continuar</p>
            </div>
        </section>

        <!-- Login Section -->
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <h2>Iniciar Sesión</h2>
                        <p>Ingresa tus credenciales para acceder</p>
                    </div>
                    
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="tu@email.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required minlength="6">
                        </div>
                        
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Recordarme</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
                        
                        <div class="auth-links">
                            <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
                            <a href="register.html">¿No tienes cuenta? Regístrate</a>
                        </div>
                    </form>
                    
                    <div class="auth-divider">
                        <span>o</span>
                    </div>
                    
                    <div class="auth-social">
                        <button id="googleSignInButton" class="btn btn-outline btn-block">
                            <i class="fab fa-google"></i> Continuar con Google
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL } from '/assets/js/components/utils/utils.js';
        import { initUserMenu, login } from '/assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
        });
        
        // Funcionalidad del formulario de login
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const rememberMeElement = document.getElementById('rememberMe');
                    const rememberMe = rememberMeElement ? rememberMeElement.checked : false;
                    
                    // Validaciones
                    if (!email || !password) {
                        showNotification('Por favor complete todos los campos', 'error');
                        return;
                    }
                    
                    // Validar formato de email
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        showNotification('Por favor ingrese un correo electrónico válido', 'error');
                        return;
                    }
                    
                    // Deshabilitar botón y mostrar indicador de carga
                    loginButton.disabled = true;
                    const originalBtnText = loginButton.innerHTML;
                    loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';
                    
                    try {
                        const data = await login(email, password);
                        
                        // Guardar token de autenticación
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        showNotification('Inicio de sesión exitoso', 'success');
                        
                        // Redirigir según rol del usuario
                        if (data.user && data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    } catch (error) {
                        console.error('Error en el inicio de sesión:', error);
                        showNotification(error.message || 'Error en el inicio de sesión. Por favor intente nuevamente.', 'error');
                    } finally {
                        // Rehabilitar botón
                        loginButton.disabled = false;
                        loginButton.innerHTML = originalBtnText;
                    }
                });
            }
            
            // Toggle de visibilidad de contraseña
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            }
            
            // Inicializar Google Sign-In
            const googleSignInButton = document.getElementById('googleSignInButton');
            if (googleSignInButton) {
                googleSignInButton.addEventListener('click', async function() {
                    // Deshabilitar botón durante el proceso
                    const originalText = googleSignInButton.innerHTML;
                    googleSignInButton.disabled = true;
                    googleSignInButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';
                    
                    try {
                        // Verificar si Google Identity Services está disponible
                        if (typeof window.google === 'undefined') {
                            throw new Error('Servicio de Google no disponible. Por favor, inténtelo más tarde.');
                        }
                        
                        // Inicializar Google Sign-In
                        google.accounts.id.initialize({
                            client_id: "681063906276-26q2qk8k8u8uq35u9u3u9u3u9u3u9u3u.apps.googleusercontent.com",
                            callback: handleGoogleSignIn
                        });
                        
                        // Prompt de Google Sign-In
                        google.accounts.id.prompt((notification) => {
                            if (notification.isNotDisplayed() || notification.isSkippedMoment() || notification.isDismissedMoment()) {
                                // Si el prompt no se muestra o se omite, mostrar el botón de inicio de sesión
                                google.accounts.id.renderButton(
                                    document.getElementById("googleSignInButton"),
                                    { theme: "outline", size: "large", width: "100%", text: "signin_with" }
                                );
                            }
                        });
                        
                    } catch (error) {
                        console.error('Error al iniciar sesión con Google:', error);
                        showNotification(error.message || 'Error al iniciar sesión con Google. Por favor intente nuevamente.', 'error');
                    } finally {
                        // Rehabilitar botón
                        googleSignInButton.disabled = false;
                        googleSignInButton.innerHTML = originalText;
                    }
                });
            }
            
            // Manejar inicio de sesión con Google
            async function handleGoogleSignIn(response) {
                try {
                    const id_token = response.credential;
                    
                    // Enviar token a nuestro backend
                    const res = await fetch(`${API_BASE_URL}/api/users/google-login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ token: id_token })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        // Guardar token de autenticación
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        showNotification('Inicio de sesión exitoso', 'success');
                        
                        // Redirigir según rol del usuario
                        if (data.user && data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    } else {
                        throw new Error(data.message || 'Error en el inicio de sesión con Google');
                    }
                } catch (error) {
                    console.error('Error en el inicio de sesión con Google:', error);
                    showNotification(error.message || 'Error en el inicio de sesión con Google. Por favor intente nuevamente.', 'error');
                }
            }
        });
    </script>
</body>
