<body data-theme="light" class="login-page">
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main id="main-content">
        <!-- Hero Section -->
        <section class="hero half-height">
            <div class="hero-content">
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta para continuar</p>
            </div>
        </section>

        <!-- Login Section -->
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <h2>Iniciar Sesión</h2>
                        <p>Ingresa tus credenciales para acceder</p>
                    </div>
                    
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-input" required aria-required="true">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <div class="password-input-container">
                                <input type="password" id="password" name="password" class="form-input" required aria-required="true">
                                <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar/ocultar contraseña" aria-pressed="false">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" id="loginButton" class="btn btn-primary btn-block">Iniciar Sesión</button>
                    </form>
                    
                    <div class="divider">
                        <span>o</span>
                    </div>
                    
                    <div class="google-login">
                        <div id="googleSignInButton"></div>
                    </div>
                    
                    <div class="auth-links">
                        <p><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
                        <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar componentes migrados
        import Header from './assets/js/components/ui/Header.js';
        import Footer from './assets/js/components/ui/Footer.js';
        
        // Registrar componentes
        if (!customElements.get('site-header')) {
            customElements.define('site-header', Header);
        }
        
        if (!customElements.get('site-footer')) {
            customElements.define('site-footer', Footer);
        }
        
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL } from './assets/js/components/utils/utils.js';
        import { initUserMenu, setAuthState } from './assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
        });
        
        // Funcionalidad del formulario de login
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const rememberMe = document.getElementById('rememberMe').checked;
                    
                    // Validaciones
                    if (!email || !password) {
                        showNotification('Por favor complete todos los campos', 'error');
                        return;
                    }
                    
                    // Validar formato de email
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        showNotification('Por favor ingrese un correo electrónico válido', 'error');
                        return;
                    }
                    
                    // Deshabilitar botón y mostrar indicador de carga
                    loginButton.disabled = true;
                    const originalBtnText = loginButton.innerHTML;
                    loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando sesión...';
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/auth/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password, rememberMe })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            // Guardar token de autenticación
                            localStorage.setItem('authToken', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            
                            // Establecer estado de autenticación
                            setAuthState(true, data.user);
                            
                            showNotification('Inicio de sesión exitoso', 'success');
                            
                            // Redirigir según rol del usuario
                            if (data.user.role === 'admin') {
                                window.location.href = 'admin.html';
                            } else {
                                window.location.href = 'profile.html';
                            }
                        } else {
                            throw new Error(data.message || 'Credenciales inválidas');
                        }
                    } catch (error) {
                        console.error('Error en el inicio de sesión:', error);
                        showNotification(error.message || 'Error en el inicio de sesión. Por favor intente nuevamente.', 'error');
                    } finally {
                        // Rehabilitar botón
                        loginButton.disabled = false;
                        loginButton.innerHTML = originalBtnText;
                    }
                });
            }
            
            // Toggle de visibilidad de contraseña
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            }
        });
    </script>
</body>
