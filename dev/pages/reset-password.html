<body>
    <!-- Header Component -->
    <header-component></header-component>
    
    <main class="main-content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <h1>Recuperar Contraseña</h1>
                        <p>Ingresa tu correo electrónico y te enviaremos instrucciones para recuperar tu contraseña.</p>
                    </div>
                    
                    <form id="resetPasswordForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <button type="submit" id="resetButton" class="btn btn-primary btn-block">Enviar Instrucciones</button>
                        
                        <div class="auth-links">
                            <a href="login.html">Volver al inicio de sesión</a>
                        </div>
                    </form>
                    
                    <div id="messageContainer" class="message-container" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer Component -->
    <footer-component></footer-component>
    
    <!-- Scripts -->
    <script type="module">
        // Importar utilidades y funcionalidades
        import { API_BASE_URL, showNotification } from '/assets/js/components/utils/utils.js';
        
        // Funcionalidad del formulario de restablecimiento de contraseña
        document.addEventListener('DOMContentLoaded', function() {
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const resetButton = document.getElementById('resetButton');
            
            if (resetPasswordForm) {
                resetPasswordForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    
                    // Validaciones
                    if (!email) {
                        showNotification('Por favor ingrese su correo electrónico', 'error');
                        return;
                    }
                    
                    // Validar formato de email
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        showNotification('Por favor ingrese un correo electrónico válido', 'error');
                        return;
                    }
                    
                    // Deshabilitar botón y mostrar indicador de carga
                    resetButton.disabled = true;
                    const originalBtnText = resetButton.innerHTML;
                    resetButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/users/reset-password`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            showNotification('Se ha enviado un enlace de restablecimiento a su correo electrónico', 'success');
                            // Redirigir a la página de login después de 3 segundos
                            setTimeout(() => {
                                window.location.href = 'login.html';
                            }, 3000);
                        } else {
                            throw new Error(data.message || 'Error al enviar el enlace de restablecimiento');
                        }
                    } catch (error) {
                        console.error('Error al restablecer la contraseña:', error);
                        showNotification(error.message || 'Error al enviar el enlace de restablecimiento. Por favor intente nuevamente.', 'error');
                    } finally {
                        // Rehabilitar botón
                        resetButton.disabled = false;
                        resetButton.innerHTML = originalBtnText;
                    }
                });
            }
        });
    </script>
