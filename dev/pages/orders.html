<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main id="main-content">
        <!-- Hero Section -->
        <section class="hero half-height">
            <div class="hero-content">
                <h1>Mis Pedidos</h1>
                <p>Consulta el historial y estado de tus pedidos</p>
            </div>
        </section>

        <!-- Orders Section -->
        <section class="orders-section">
            <div class="container">
                <div class="section-header">
                    <h2>Historial de Pedidos</h2>
                    <p>Aquí encontrarás todos tus pedidos realizados</p>
                </div>
                
                <div id="ordersContainer" class="orders-container">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar componentes
        import Header from './assets/js/components/ui/Header.js';
        import Footer from './assets/js/components/ui/Footer.js';
        
        // Registrar componentes personalizados
        if (!customElements.get('site-header')) {
            customElements.define('site-header', Header);
        }
        
        if (!customElements.get('site-footer')) {
            customElements.define('site-footer', Footer);
        }
        
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL, isAuthenticated } from './assets/js/components/utils/utils.js';
        import { initUserMenu } from './assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
            
            // Verificar autenticación
            if (!isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }
            
            // Cargar pedidos
            loadOrders();
        });
        
        // Cargar pedidos
        async function loadOrders() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                
                const response = await fetch(`${API_BASE_URL}/api/orders`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Error al cargar los pedidos');
                }
                
                const orders = await response.json();
                displayOrders(orders);
            } catch (error) {
                console.error('Error al cargar pedidos:', error);
                showNotification('Error al cargar los pedidos', 'error');
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="error-message">
                        <p><i class="fas fa-exclamation-circle"></i> Error al cargar los pedidos. Por favor, inténtelo de nuevo más tarde.</p>
                    </div>
                `;
            }
        }
        
        // Mostrar pedidos
        function displayOrders(orders) {
            const container = document.getElementById('ordersContainer');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="fas fa-shopping-bag"></i>
                        <h3>No tienes pedidos aún</h3>
                        <p>¡Explora nuestra tienda y realiza tu primera compra!</p>
                        <a href="/products.html" class="btn btn-primary">Ver Productos</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-info">
                            <h3>Pedido #${order.id}</h3>
                            <p class="order-date">${new Date(order.created_at).toLocaleDateString('es-CL')}</p>
                        </div>
                        <div class="order-status ${order.status.toLowerCase()}">
                            <span>${order.status}</span>
                        </div>
                    </div>
                    
                    <div class="order-details">
                        <div class="order-summary">
                            <p><strong>Total:</strong> $${order.total.toLocaleString('es-CL')}</p>
                            <p><strong>Productos:</strong> ${order.items?.length || 0}</p>
                        </div>
                        
                        <button class="btn btn-secondary" onclick="viewOrderDetails(${order.id})">
                            Ver Detalles
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // Ver detalles del pedido
        function viewOrderDetails(orderId) {
            // Redirigir a la página de detalles del pedido
            window.location.href = `order-detail.html?id=${orderId}`;
        }
    </script>
</body>
</html>
