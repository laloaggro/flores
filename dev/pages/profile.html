<body data-theme="light">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <!-- Header -->
    <site-header></site-header>

    <main>
        <section class="profile-section">
            <div class="container">
                <h1>Perfil de Usuario</h1>
                <div id="profileContainer" class="profile-container">
                    <div class="loading-placeholder">
                        <p><i class="fas fa-spinner fa-spin"></i> Cargando perfil...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <site-footer></site-footer>

    <!-- Scripts -->
    <script type="module">
        // Importar componentes migrados
        import Header from './assets/js/components/ui/Header.js';
        import Footer from './assets/js/components/ui/Footer.js';
        
        // Importar utilidades y funcionalidades
        import { showNotification, API_BASE_URL, isAuthenticated } from './assets/js/components/utils/utils.js';
        import { initUserMenu } from './assets/js/components/utils/auth.js';
        
        // Inicializar menú de usuario
        document.addEventListener('DOMContentLoaded', () => {
            initUserMenu();
            
            // Verificar autenticación
            if (!isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }
            
            // Cargar perfil
            loadProfile();
        });
        
        // Cargar perfil
        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE_URL}/profile`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Error al cargar el perfil');
                }
                
                const user = await response.json();
                renderProfile(user);
            } catch (error) {
                console.error('Error al cargar el perfil:', error);
                showNotification('Error al cargar el perfil', 'error');
                document.getElementById('profileContainer').innerHTML = '<p>Error al cargar el perfil. Por favor intente nuevamente.</p>';
            }
        }
        
        // Renderizar perfil
        function renderProfile(user) {
            const profileContainer = document.getElementById('profileContainer');
            if (!profileContainer) return;
            
            profileContainer.innerHTML = `
                <div class="profile-card">
                    <div class="profile-header">
                        <h2>${user.name}</h2>
                        <p>${user.email}</p>
                    </div>
                    <div class="profile-details">
                        <div class="profile-field">
                            <label>Nombre:</label>
                            <span>${user.name}</span>
                        </div>
                        <div class="profile-field">
                            <label>Email:</label>
                            <span>${user.email}</span>
                        </div>
                        <div class="profile-field">
                            <label>Fecha de registro:</label>
                            <span>${new Date(user.createdAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button onclick="editProfile()" class="btn btn-primary">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </button>
                        <button onclick="changePassword()" class="btn btn-secondary">
                            <i class="fas fa-key"></i> Cambiar Contraseña
                        </button>
                        <button onclick="logout()" class="btn btn-danger">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Editar perfil
        function editProfile() {
            showNotification('Funcionalidad de edición de perfil no implementada aún', 'info');
        }
        
        // Cambiar contraseña
        function changePassword() {
            showNotification('Funcionalidad de cambio de contraseña no implementada aún', 'info');
        }
        
        // Cerrar sesión
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            setAuthState(false);
            window.location.href = '/index.html';
        }
    </script>
