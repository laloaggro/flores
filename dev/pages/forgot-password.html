<body>
    <!-- Header Component -->
    <header-component></header-component>
    
    <main class="main-content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-header">
                        <h1>¿Olvidaste tu Contraseña?</h1>
                        <p>Ingresa tu correo electrónico y te enviaremos instrucciones para recuperar tu contraseña.</p>
                    </div>
                    
                    <form id="forgotPasswordForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">Enviar Instrucciones</button>
                        
                        <div class="auth-links">
                            <a href="login.html">Volver al inicio de sesión</a>
                        </div>
                    </form>
                    
                    <div id="messageContainer" class="message-container" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer Component -->
    <footer-component></footer-component>
    
    <!-- Scripts -->
    <script type="module">
        import { API_BASE_URL, showNotification } from '/assets/js/components/utils/utils.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const messageContainer = document.getElementById('messageContainer');
            
            forgotPasswordForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/users/forgot-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        messageContainer.innerHTML = `
                            <div class="alert alert-success">
                                <p>${data.message}</p>
                                ${data.resetToken ? `<p>Para propósitos de prueba, el token es: ${data.resetToken}</p>
                                <p><a href="new-password.html?token=${data.resetToken}">Restablecer contraseña</a></p>` : ''}
                            </div>
                        `;
                        messageContainer.style.display = 'block';
                        forgotPasswordForm.reset();
                    } else {
                        messageContainer.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
                        messageContainer.style.display = 'block';
                    }
                } catch (error) {
                    messageContainer.innerHTML = `<div class="alert alert-error">Error de conexión. Por favor, inténtalo más tarde.</div>`;
                    messageContainer.style.display = 'block';
                }
            });
        });
    </script>
</body>
